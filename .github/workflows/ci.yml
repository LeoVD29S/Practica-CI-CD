name: Laravel CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, fileinfo
          coverage: none

      - name: Validar Composer
        run: composer validate --no-check-publish

      - name: Instalar dependencias
        run: composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Preparar entorno Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear

      - name: Ejecutar pruebas automatizadas
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test
